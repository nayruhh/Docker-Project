services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: llmuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: llmdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmuser -d llmdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No published port: only the api container needs to reach it.

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides any DATABASE_URL in .env, which points at localhost for local runs
      DATABASE_URL: postgresql://llmuser:${POSTGRES_PASSWORD}@db:5432/llmdb
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
