name: Docker

on:
  push:
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Build and run the Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        # .env is gitignored; the example holds placeholder values that are fine for CI
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Build and start the stack
        # --wait blocks until every service with a health check is healthy
        run: docker compose up --build -d --wait --wait-timeout 120

      - name: API responds
        run: |
          curl -sf http://localhost:8000/docs > /dev/null
          curl -sf http://localhost:8000/history
          echo

      - name: Backend runs as a non-root user
        run: |
          uid=$(docker compose exec -T backend id -u)
          echo "backend uid: $uid"
          test "$uid" != "0"

      - name: Only the backend is published to the host
        run: |
          if docker compose port postgres 5432 | grep -q .; then echo "postgres is exposed"; exit 1; fi
          if docker compose port redis 6379 | grep -q .; then echo "redis is exposed"; exit 1; fi

      - name: Database records survive a restart
        run: |
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          INSERT INTO qa_records (question, normalized_question, answer)
          VALUES ('ci?', 'ci?', 'persisted');
          SQL
          docker compose down                      # removes containers but keeps the named volume
          docker compose up -d --wait --wait-timeout 120
          curl -sf http://localhost:8000/history | grep -q persisted

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v
