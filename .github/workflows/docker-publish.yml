name: Publish to Docker Hub

# Build the image and push it to Docker Hub whenever code lands on main.
# Pushing a version tag (v1.0.0) also publishes release tags (1.0.0, 1.0).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  IMAGE_NAME: qa-backend

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # commit SHA, e.g. username/qa-backend:sha-1a2b3c4
            type=sha
            # "latest" always points at the newest build of main
            type=raw,value=latest,enable={{is_default_branch}}
            # release tags, only when a v1.2.3 tag is pushed
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
